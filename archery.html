<title>Ollie the Bullseye Bandit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one full-height range seen from the shooting line. Painted wooden signs,
   the HUD and the result card float over a single canvas. Single daylight look by choice. */
:root {
  --sky: #a9dbe6; --sky-low: #e9f4dc;
  --grass: #6fae4e; --grass-dark: #63a045; --tree: #2f5d3a;
  --gold: #f6cf2b; --red: #d8362b; --blue: #2f7fc2; --black: #22262b; --white: #f7f5ee;
  --straw: #d9b566; --wood: #8a5a33; --wood-dark: #5a371d;
  --plank: #b67f4b; --plank-dark: #8f5f33; --pegboard: #efe0bd;
  --stone: #30343b; --stone-dark: #23262c; --iron: #59606b; --brass: #d1a84f;
  --paper: #fbf7ea; --ink: #23281f; --page: #1c3325;
  --display: "Alfa Slab One", Rockwell, "Roboto Slab", Georgia, serif;
  --ui: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  box-sizing: border-box; background: var(--page); color: var(--ink);
  font-family: var(--ui); font-size: 17px;
  padding-inline: 16px; padding-block: 12px;
  display: flex; justify-content: center;
}
.stage {
  position: relative; width: 100%; max-width: 1100px; height: 100%; min-height: 380px;
  border-radius: 10px; overflow: hidden; background: var(--sky);
  user-select: none; -webkit-user-select: none;
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; outline-offset: -4px; }
canvas:focus-visible, button:focus-visible { outline: 3px solid var(--gold); }

.hud {
  position: absolute; inset: 0 0 auto 0; display: flex; justify-content: space-between;
  align-items: flex-start; gap: 8px; padding: 10px 12px; pointer-events: none;
}
.hud button, .stats span {
  font: 600 16px/1 var(--ui); letter-spacing: .04em; text-transform: uppercase;
  background: var(--paper); color: var(--ink); border: 2px solid var(--ink);
  border-radius: 4px; padding: 7px 10px;
}
.hud button { pointer-events: auto; cursor: pointer; }
.stats { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin-left: auto; }
.hud #gold { margin-left: auto; background: var(--gold); }
#armoryBtn:not([hidden]) + .stats { margin-left: 0; }
@media (max-width: 600px) { .wide { display: none; } }
.stats span { font-variant-numeric: tabular-nums; white-space: nowrap; }
.stats b { font-weight: 700; margin-left: 5px; }

.banner {
  position: absolute; inset: 52px 0 auto 0; text-align: center; pointer-events: none;
  padding-inline: 12px;
}
.banner h1 {
  margin: 0; font: 400 clamp(26px, min(5.5vw, 7vh), 50px)/1.05 var(--display);
  color: var(--white); text-wrap: balance;
  text-shadow: 0 3px 0 var(--wood-dark), 0 6px 14px rgba(34, 38, 43, .25);
}
.banner p {
  margin: 6px auto 0; display: inline-block; font: 600 16px/1.2 var(--ui);
  letter-spacing: .05em; text-transform: uppercase; color: var(--ink);
  background: rgba(251, 247, 234, .82); padding: 4px 10px; border-radius: 3px;
}

.sign {
  position: absolute; transform: translate(-50%, -100%) rotate(var(--tilt, -2deg));
  font: 400 clamp(13px, 3.4vw, 24px)/1 var(--display); letter-spacing: .03em; text-transform: uppercase;
  color: var(--white); background: var(--wood); border: 0;
  border-bottom: 5px solid var(--wood-dark); border-radius: 4px;
  padding: .55em .7em .45em; cursor: pointer; white-space: nowrap;
  box-shadow: 0 4px 0 rgba(34, 38, 43, .18);
}
.sign:nth-child(even) { --tilt: 2deg; }
.many .sign { font-size: clamp(12px, 2.6vw, 20px); }
.sign:hover { background: var(--wood-dark); }

.result {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
  background: rgba(28, 51, 37, .45);
}
.result div {
  background: var(--paper); border: 3px solid var(--ink); border-radius: 6px;
  padding: 22px 26px; text-align: center; max-width: 320px; width: 100%;
  display: flex; flex-direction: column; gap: 8px; align-items: center;
}
.result h2 { margin: 0; font: 600 16px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; }
.result strong { font: 400 72px/1 var(--display); color: var(--red); font-variant-numeric: tabular-nums; }
.result p { margin: 0; font-weight: 500; }
.result nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
.result button {
  font: 600 17px/1 var(--ui); letter-spacing: .04em; text-transform: uppercase; cursor: pointer;
  padding: 10px 14px; border-radius: 4px; border: 2px solid var(--ink);
  background: var(--paper); color: var(--ink);
}
.result button.go { background: var(--gold); }
.result ul { list-style: none; margin: 4px 0; padding: 0; width: 100%; font-variant-numeric: tabular-nums; }
.result li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-weight: 500; border-top: 1px solid rgba(35, 40, 31, .25); }
.result li.done { font-weight: 700; }
#rGoal:empty { display: none; }
.result > div { max-height: 100%; overflow-y: auto; box-sizing: border-box; }
.result li { align-items: center; }
.result button:disabled { opacity: .5; cursor: default; }
#rCoins { font-weight: 700; }

/* Rooms: the shop (awning, pegboard shelves, price tags) and the armory (stone wall, torchlight, racks). */
.room { position: absolute; inset: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-bottom: 22px; }
.room header {
  position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: 10px; padding: 12px 14px;
}
.room h2 { margin: 0; font: 400 clamp(19px, 4.4vw, 32px)/1 var(--display); text-wrap: balance; padding: 8px 14px; border-radius: 4px; }
.room button {
  font: 600 15px/1 var(--ui); letter-spacing: .04em; text-transform: uppercase; cursor: pointer;
  padding: 8px 11px; border-radius: 4px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
}
.room button.go { background: var(--gold); }
.room button:disabled { opacity: .6; cursor: default; }
.room .keeper { margin: 0 14px; font: 600 17px/1.3 var(--ui); align-self: flex-start; }
.room section { margin: 0 14px; }
.doors { display: flex; gap: 8px; }
.room h3 { display: inline-block; margin: 0 0 8px; padding: 5px 9px; border-radius: 3px; font: 600 14px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; }
.room #shelves, .room #racks { display: flex; flex-direction: column; gap: 18px; }
.room ul { list-style: none; margin: 0; padding: 12px 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 12px 10px; }
.room li { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 8px 6px; border-radius: 5px; text-align: center; color: var(--ink); }
.room li b { font: 600 16px/1.15 var(--ui); }
.room li svg { width: 100%; max-width: 128px; height: 56px; overflow: visible; filter: drop-shadow(0 2px 0 rgba(34, 38, 43, .3)); }
.room li.target svg { max-width: 56px; }

.store { background: repeating-linear-gradient(90deg, var(--plank) 0 78px, var(--plank-dark) 78px 80px); color: var(--ink); }
.store header { background: repeating-linear-gradient(90deg, var(--red) 0 28px, var(--white) 28px 56px); border-bottom: 5px solid var(--wood-dark); box-shadow: 0 4px 0 rgba(34, 38, 43, .2); }
.store h2 { background: var(--wood-dark); color: var(--white); }
.purse { font: 700 16px/1 var(--ui); font-variant-numeric: tabular-nums; background: var(--gold); border: 2px solid var(--ink); border-radius: 999px; padding: 7px 13px; }
.store .keeper { background: var(--paper); border: 2px solid var(--ink); border-radius: 12px 12px 12px 2px; padding: 8px 12px; }
.store h3 { background: var(--black); color: var(--white); }
.store ul {   /* a pegboard with a shelf plank along the bottom */
  background: radial-gradient(circle, rgba(90, 55, 29, .3) 1.5px, transparent 2px) 0 0 / 16px 16px, var(--pegboard);
  border-bottom: 10px solid var(--wood-dark); border-radius: 4px 4px 0 0; box-shadow: 0 6px 0 rgba(34, 38, 43, .22);
}
.store li.own { opacity: .6; }
.tag {
  position: relative; font: 700 15px/1 var(--ui); font-variant-numeric: tabular-nums; background: var(--paper);
  border: 1.5px solid var(--ink); border-radius: 3px; padding: 4px 8px 4px 16px; transform: rotate(-3deg);
}
.tag::before { content: ""; position: absolute; left: 6px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--ink); }

.armory {
  color: var(--white); background-color: var(--stone);
  background-image: radial-gradient(circle at 6% 0, rgba(255, 179, 71, .4), transparent 34%), radial-gradient(circle at 94% 0, rgba(255, 179, 71, .4), transparent 34%),
    linear-gradient(var(--stone-dark) 2px, transparent 2px), linear-gradient(90deg, var(--stone-dark) 2px, transparent 2px);
  background-size: auto, auto, 64px 32px, 64px 32px;
}
.armory header { background: var(--stone-dark); border-bottom: 4px solid var(--iron); }
.armory h2 { color: var(--brass); padding-inline: 0; }
.armory h3 { background: var(--iron); color: var(--white); }
.armory ul { background: var(--plank); border-top: 8px solid var(--iron); border-radius: 3px; box-shadow: 0 6px 0 rgba(0, 0, 0, .3); }   /* a wooden rack on an iron rail */
.armory li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--stone-dark); }   /* the peg it hangs from */
.armory li.on { background: rgba(251, 247, 234, .4); outline: 3px solid var(--brass); }
.plaque { font: 700 13px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); background: var(--brass); border: 1.5px solid var(--ink); border-radius: 2px; padding: 6px 9px; }
</style>

<div class="stage" id="stage">
  <canvas id="cv" tabindex="0" aria-label="Archery range. Press and hold to draw the bow, release to loose. With a keyboard, aim with the arrow keys and hold Space."></canvas>
  <div class="hud">
    <button id="back" type="button" hidden>&larr; Range</button>
    <button id="musicBtn" type="button" title="Music and sound effects">&#9834; On</button>
    <button id="gold" type="button">Golden Arrow</button>
    <button id="shopBtn" type="button">Shop</button>
    <button id="armoryBtn" type="button" class="wide">Armory</button>
    <div class="stats" id="stats"></div>
  </div>
  <div class="banner">
    <h1 id="h1">Ollie the Bullseye Bandit</h1>
    <p id="sub"></p>
  </div>
  <div id="signs"></div>
  <div class="room store" id="shop" hidden>
    <header>
      <span class="doors">
        <button type="button" data-room="">&larr; Leave</button>
        <button type="button" data-room="armory">Armory &rarr;</button>
      </span>
      <h2>The Fletcher's Shop</h2>
      <span class="purse" id="purse"></span>
    </header>
    <p class="keeper" id="keeper"></p>
    <div id="shelves"></div>
  </div>
  <div class="room armory" id="armory" hidden>
    <header>
      <button type="button" data-room="">&larr; Leave</button>
      <h2>Your Armory</h2>
      <button type="button" data-room="shop">To the shop &rarr;</button>
    </header>
    <p class="keeper">Everything you own hangs here. Choose what to carry out to the range.</p>
    <div id="racks"></div>
  </div>
  <div class="result" id="trophy" hidden>
    <div>
      <h2>Golden Arrow</h2>
      <p id="goalState"></p>
      <ul id="goals"></ul>
      <nav><button id="trophyClose" type="button">Close</button></nav>
    </div>
  </div>
  <div class="result" id="result" hidden>
    <div>
      <h2 id="rName"></h2>
      <strong id="rScore"></strong>
      <p id="rNote"></p>
      <p id="rBest"></p>
      <p id="rCoins"></p>
      <p id="rGoal"></p>
      <nav>
        <button class="go" id="again" type="button">Shoot again</button>
        <button id="home" type="button">Back to range</button>
      </nav>
    </div>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
const css = getComputedStyle(document.documentElement);
const C = {};
['sky','sky-low','grass','grass-dark','tree','gold','red','blue','black','white','straw','wood','wood-dark','paper','ink']
  .forEach(k => C[k] = css.getPropertyValue('--' + k).trim());
const DISPLAY = css.getPropertyValue('--display'), UI = css.getPropertyValue('--ui');
const RINGS = [C.white, C.white, C.black, C.black, C.blue, C.blue, C.red, C.red, C.gold, C.gold];
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = Math.random, TAU = Math.PI * 2;

let W = 0, H = 0, U = 0, HZ = 0;          // stage size, short side, horizon
let scene = null, t = 0, wind = 0;
let arrows = [], stuck = [], pops = [], parts = [], timers = [];
const ptr = { x: 0, y: 0, down: false, t0: 0, touch: false, seen: false };

/* ---------- Golden Arrow: earned by reaching a goal in every round ---------- */
const GOALS = [   // [best-score key, round, score to reach, true when fewer is better]
  ['rush', 'Classic', 30], ['bullseye30', 'Bullseyes, 30 sec', 3], ['bullseye60', 'Bullseyes, 60 sec', 6],
  ['apple', 'One apple', 2], ['applerow12', 'Apple row', 24, true], ['balloons', 'Balloons, 30 sec', 12]];
const mem = {};   // keeps bests for this visit when browser storage is unavailable
let golden = false;
function bestOf(key) {
  try { return Math.max(mem[key] || 0, +localStorage.getItem('nl-best-' + key) || 0); } catch (e) { return mem[key] || 0; }
}
function saveBest(key, v) { mem[key] = v; try { localStorage.setItem('nl-best-' + key, v); } catch (e) {} }
function met(g) { const b = bestOf(g[0]); return g[3] ? b > 0 && b <= g[2] : b >= g[2]; }
function refreshGold() {
  const done = GOALS.filter(met).length;
  golden = done === GOALS.length;
  $('gold').innerHTML = '<span class="wide">Golden Arrow </span>★ ' + (golden ? 'earned' : done + '/' + GOALS.length);
  $('goalState').textContent = golden ? 'Earned. The Golden Arrow and Golden Bow hang in your armory.'
    : 'Reach all ' + GOALS.length + ' goals to earn the Golden Arrow and the Golden Bow. No coins can buy them.';
  $('goals').innerHTML = GOALS.map(g => {
    const b = bestOf(g[0]), ok = met(g);
    return '<li' + (ok ? ' class="done"' : '') + '><span>' + (ok ? '✓ ' : '') + g[1] + '</span><span>' +
      (b || '–') + ' / ' + g[2] + (g[3] ? ' or fewer' : '') + '</span></li>';
  }).join('');
}

/* ---------- coins, shop and gear ---------- */
const SHOP = {
  bow: [     // a: limbs, b: grip and trim, s: string
    { id: 'wood', name: 'Longbow', a: C.wood, b: C['wood-dark'], price: 0 },
    { id: 'recurve', name: 'Red recurve', a: C.red, b: C.black, curl: true, price: 120 },
    { id: 'candy', name: 'Candy cane bow', a: C.white, b: C.red, dash: true, price: 150 },
    { id: 'frost', name: 'Frost bow', a: '#9fdcf5', b: C.white, s: '#dff4ff', price: 180 },
    { id: 'neon', name: 'Neon bow', a: '#b6ff3c', b: '#ff4fd8', glow: true, price: 220 },
    { id: 'dragon', name: 'Dragon bow', a: '#1f6b45', b: C.gold, spikes: true, price: 300 },
    { id: 'double', name: 'Double bow', a: '#7a4a8c', b: C.gold, twin: true, price: 350 },
    { id: 'storm', name: 'Storm bow', a: '#2b3a67', b: '#ffe14d', s: '#ffe14d', zap: true, price: 450 },
    { id: 'lava', name: 'Lava bow', a: '#3a2420', b: '#ff6a1a', s: '#ffb347', glow: '#ff6a1a', ember: true, price: 550 },
    { id: 'crystal', name: 'Crystal bow', a: '#8fe6ff', b: '#e9fbff', s: '#e9fbff', glow: true, spikes: true, price: 650 },
    { id: 'kraken', name: 'Kraken bow', a: '#3c8f7c', b: '#f08fb0', wave: true, price: 800 },
    { id: 'galaxy', name: 'Galaxy bow', a: '#6b3fa0', b: C.white, glow: true, hue: true, stars: true, price: 900 },
    { id: 'compound', name: 'Compound bow (no pull back)', a: '#3a4048', b: '#ff7a1a', cams: true, instant: true, price: 1000 },
    { id: 'mecha', name: 'Mecha bow', a: '#c0c7d1', b: '#19e0ff', s: '#19e0ff', cams: true, twin: true, zap: true, glow: '#19e0ff', price: 1500 },
    { id: 'golden', name: 'Golden Bow', a: C.gold, b: C.white, s: C.gold, glow: true, earn: true }],
  arrow: [   // a: shaft, b: feathers, fx: special effect
    { id: 'wood', name: 'Classic', a: C['wood-dark'], b: C.red, price: 0 },
    { id: 'blue', name: 'Blue feather', a: C['wood-dark'], b: C.blue, price: 50 },
    { id: 'night', name: 'Midnight', a: C.black, b: C.white, price: 100 },
    { id: 'lime', name: 'Lime', a: '#2e7d32', b: '#b6e04a', price: 100 },
    { id: 'pink', name: 'Bubblegum', a: '#c2378a', b: '#ffb3dd', price: 150 },
    { id: 'plunger', name: 'Plunger arrow', a: C['wood-dark'], b: C.red, fx: 'plunger', price: 120 },
    { id: 'fire', name: 'Flame arrow', a: '#e8452c', b: '#ffd23f', fx: 'fire', price: 200 },
    { id: 'frost', name: 'Frost arrow', a: '#7cc7f2', b: C.white, fx: 'frost', price: 200 },
    { id: 'rainbow', name: 'Rainbow arrow', a: '#8a4fd0', b: '#ffd23f', fx: 'rainbow', price: 300 },
    { id: 'rocket', name: 'Rocket arrow', a: '#e9edf2', b: C.red, fx: 'rocket', boom: true, price: 400 },
    { id: 'bolt', name: 'Lightning bolt', a: '#ffe14d', b: C.white, fx: 'bolt', price: 500 },
    { id: 'fish', name: 'Flying fish', a: '#4aa3d8', b: '#f08f3c', fx: 'fish', price: 600 },
    { id: 'chicken', name: 'Rubber chicken', a: '#ffd84a', b: '#ffb020', fx: 'chicken', price: 750 },
    { id: 'comet', name: 'Comet arrow', a: '#bfe9ff', b: '#8a4fd0', fx: 'comet', big: true, boom: true, price: 900 },
    { id: 'disco', name: 'Disco arrow', a: '#ff4fd8', b: '#19e0ff', fx: 'disco', big: true, boom: true, price: 1100 },
    { id: 'dragonfire', name: 'Dragon breath arrow', a: '#7a1512', b: C.gold, fx: 'fire', big: true, boom: true, price: 1400 },
    { id: 'enchanted', name: 'Enchanted arrow (never misses)', a: '#7b5cff', b: '#7ffcff', fx: 'magic', big: true, boom: true, home: true, price: 3000 },
    { id: 'golden', name: 'Golden Arrow', a: C.gold, b: C.white, earn: true }],
  target: [  // a and b alternate in bands; the classic face has no a and keeps the five ring colors
    { id: 'classic', name: 'Classic', price: 0 },
    { id: 'red', name: 'Red and white', a: C.red, b: C.white, price: 75 },
    { id: 'blue', name: 'Blue and white', a: C.blue, b: C.white, price: 75 },
    { id: 'green', name: 'Green and white', a: '#2e8b46', b: C.white, price: 120 },
    { id: 'purple', name: 'Purple and gold', a: '#6b3fa0', b: C.gold, price: 175 },
    { id: 'night', name: 'Black and gold', a: C.black, b: C.gold, price: 250 }]
};
const TRAIL = {   // sparks left behind by special arrows in flight
  fire: ['#e8452c', '#ff8a1f', '#ffd23f'], frost: ['#7cc7f2', '#bfe9ff', '#ffffff'],
  rainbow: ['#e8452c', '#ffd23f', '#4cc24a', '#2f7fc2', '#8a4fd0'], disco: ['#ff4fd8', '#19e0ff', '#ffe14d', '#4cc24a', '#ffffff'],
  rocket: ['#ff8a1f', '#9aa0a8', '#d5d8dc'], bolt: ['#ffe14d', '#ffffff'], fish: ['#7cc7f2', '#bfe9ff'],
  chicken: ['#ffffff', '#ffe9a8'], comet: ['#ffffff', '#bfe9ff', '#b79cff'],
  magic: ['#7b5cff', '#7ffcff', '#ffffff', '#ff9cf5'] };
const save = { coins: 0, own: { bow: ['wood'], arrow: ['wood'], target: ['classic'] }, eq: { bow: 'wood', arrow: 'wood', target: 'classic' } };
try {
  const old = JSON.parse(localStorage.getItem('nl-save') || 'null');
  if (old) {
    save.coins = Math.max(0, Math.floor(+old.coins) || 0);
    ['bow', 'arrow', 'target'].forEach(k => {
      if (old.own && Array.isArray(old.own[k])) save.own[k] = old.own[k];
      if (old.eq && old.eq[k]) save.eq[k] = old.eq[k];
    });
  }
} catch (e) {}
function store() { try { localStorage.setItem('nl-save', JSON.stringify(save)); } catch (e) {} }
// Test link: opening the game with ?testcoins adds 3000 coins once, then tidies the address so a reload does not add more.
if (/[?&]testcoins\b/.test(location.search)) {
  save.coins += 3000; store();
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
}
function owns(kind, it) { return it.earn ? golden : save.own[kind].includes(it.id); }
function gear(kind) { return SHOP[kind].find(it => it.id === save.eq[kind] && owns(kind, it)) || SHOP[kind][0]; }

/* The shop and the armory are two rooms: you buy off the shelves in one and pick your loadout from the racks in the other. */
function preview(kind, it) {   // a small drawing of the item for a shelf or rack
  if (kind === 'bow') {
    let h = '<svg viewBox="0 0 120 60" aria-hidden="true"' + (it.glow ? ' style="filter:drop-shadow(0 0 4px ' + (it.glow === true ? it.a : it.glow) + ')"' : '') + '>';
    h += '<path d="M12 46 L108 46" stroke="' + (it.s || C.white) + '" stroke-width="1.2"/>';
    h += '<path d="M12 46 Q60 -8 108 46" fill="none" stroke="' + it.a + '" stroke-width="5" stroke-linecap="round"/>';
    if (it.dash) h += '<path d="M12 46 Q60 -8 108 46" fill="none" stroke="' + it.b + '" stroke-width="5" stroke-dasharray="7 9"/>';
    if (it.curl) h += '<path d="M12 46 L4 36 M108 46 L116 36" stroke="' + it.a + '" stroke-width="5" stroke-linecap="round"/>';

const ROOMS = [['bow', 'Bows', 'Bow rack'], ['arrow', 'Arrows', 'Quiver'], ['target', 'Targets', 'Target faces']];

/* ---------- shooting ---------- */
function aim() {
  const hold = ptr.down ? t - ptr.t0 : 0;
  // A compound bow is always at full draw: just click or tap to shoot.
  const quick = gear('bow').instant, p = quick ? 1 : Math.min(1, hold / (scene.drawTime || 0.65));
  let amp = quick ? 0.4 : ptr.down ? 1 - 0.6 * p : 1;
  const tired = quick ? 0 : Math.max(0, hold - 2);
  amp += Math.min(2.5, tired * 0.9);
  const a = U * 0.013 * amp;
  return {
    x: ptr.x + (Math.sin(t * 2.1) + Math.sin(t * 3.7 + 1) * 0.6) * a,
    y: ptr.y - (ptr.touch ? 64 : 0) + (Math.cos(t * 1.7 + 2) + Math.sin(t * 4.3) * 0.5) * a,
    p, tired: tired > 0
  };
}
function fire() {
  const a = aim(), p = Math.max(0.12, a.p);
  // An underdrawn bow drops the arrow short; wind pushes it sideways.
  let x = a.x + wind * U * 0.07, y = a.y + (1 - p) * (1 - p) * U * 0.45;
  const s = scene.snap && scene.snap(x, y);
  if (s) { x = s.x; y = s.y; }
  // The enchanted arrow bends toward the nearest target and always lands dead center.
  let home = null;
  if (!s && gear('arrow').home && scene.homing) {
    let best = Infinity;
    scene.homing().forEach(tg => { const d = Math.hypot(x - tg.x, y - tg.y) - tg.r; if (d < best) { best = d; home = tg; } });
    if (home) {
      home = { tg: home, ox: 0, oy: 0 };
    }
  }
  arrows.push({ x0: W / 2, y0: H + 10, x, y, to: s || null, home, t: 0, T: 0.34 });
  sfx('shoot');
}
function stick(ref, x, y) {
  stuck.push(ref ? { ref, ox: (x - ref.x) / ref.r, oy: (y - ref.y) / ref.r } : { fx: x / W, fy: y / H });
}
function pop(x, y, text, color) { pops.push({ x, y, text, color: color || C.white, t: 0 }); }
function after(sec, fn) { timers.push({ t: sec, fn }); }
function ringScore(tg, x, y) {
  const d = Math.hypot(x - tg.x, y - tg.y) / tg.r;
  if (d >= 1) return { v: 0, l: 'M' };
  const v = 10 - Math.floor(d * 10);
  return { v, l: d < 0.05 ? 'X' : String(v) };
}
function newWind(max) { wind = max * (0.6 + rand() * 0.4) * (rand() < 0.5 ? -1 : 1); }
function windText() {
  const n = Math.round(Math.abs(wind) * 6);
  return n ? (wind < 0 ? '← ' : '') + n + ' m/s' + (wind > 0 ? ' →' : '') : 'calm';
}

/* ---------- scenes ---------- */
// Streak bonus: from the 5th hit in a row, every hit scores double until you miss.
function bonus(n) {
  if (n === 5) pop(W / 2, H * 0.3, 'Streak! Double points', C.gold);
  return n >= 5 ? 2 : 1;
}
const streakText = n => n + (n >= 5 ? ' \u00d72' : '');

function Menu(title, sub, opts, parent, backTo) {
  const hit = (x, y) => opts.findIndex(o => Math.hypot(x - o.x, y - o.y) < o.r);
  return {
    name: title, sub, parent, backTo, menu: true, picked: false, going: false,
    signs: opts.map(o => o.label),
    // Pressing a sign looses an arrow straight into that target's bullseye.
    choose(i) {
      if (this.picked) return;
      this.picked = true;
      arrows.push({ x0: W / 2, y0: H + 10, x: opts[i].x, y: opts[i].y, to: opts[i], t: 0, T: 0.34 });
      sfx('shoot');
    },
    signPos() { return opts.map(o => ({ x: o.x, y: o.y - o.r - 14 })); },
    layout() {
      const n = opts.length, span = [0, 0, 0.44, 0.32, 0.235][n];
      opts.forEach((o, i) => {
        o.r = n === 2 ? Math.min(W * 0.17, H * 0.16) : Math.min(W * (n === 3 ? 0.125 : 0.095), H * 0.15);
        o.x = W * (0.5 + (i - (n - 1) / 2) * span);
        o.y = HZ - o.r * (n === 2 ? 0.6 : 0.75);
      });
      // The home range starts with an arrow already in each bullseye.
      if (!parent && !this.seeded) { this.seeded = true; opts.forEach(o => stick(o, o.x, o.y)); }
    },
    ready() { return !this.picked; },
    // Any shot that reaches a target is pulled into its bullseye.
    snap(x, y) { const i = hit(x, y); return i < 0 ? null : opts[i]; },
    update() {},
    draw() { opts.forEach(o => drawTarget(o)); },
    land(x, y) {
      const i = hit(x, y);
      if (i < 0) return false;
      if (this.going) return true;
      this.picked = this.going = true;
      const old = stuck.find(a => a.ref === opts[i]);   // the new arrow splits the one already there
      if (old) {
        old.split = true;
        for (let j = 0; j < 8; j++) { const a = rand() * TAU, v = U * (0.12 + rand() * 0.2); parts.push({ x: opts[i].x, y: opts[i].y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, c: C.wood }); }
      }
      stick(opts[i], opts[i].x, opts[i].y);
      pop(opts[i].x, opts[i].y - opts[i].r * 0.45, old ? 'Split!' : 'Bullseye!', C.gold);

}

// Classic: a flat-out sprint down the range while targets rush past on both sides.
function Rush() {
  const ts = [];
  let score = 0, away = 0, spawn = 0.6, run = 0, dist = 0, sp = 1, streak = 0;
  const drop = () => (H - HZ) * 1.15;
  function place(tg) {
    const s = 1 / tg.d;
    tg.r = U * 0.2 * s;
    tg.x = W / 2 + tg.lane * W * 0.62 * s;
    tg.y = HZ + drop() * s - tg.r * 1.35;
  }
  return {
    homing: () => ts,
    intensity: () => Math.min(1, run / 50),
    name: 'Classic', key: 'rush', coin: s => Math.round(s / 3), again: Rush, parent: mainMenu, backTo: 'Range', drawTime: 0.35,
    sub: 'Hit the targets as they rush past. Let 5 get away and the run is over.',
    layout() { ts.forEach(place); },
    ready() { return !this.ended; },
    update(dt) {
      if (this.ended) return;
      run += dt; sp = Math.min(2.6, 1 + run * 0.035) * 0.7; dist += sp * dt * 3.2;
      spawn -= dt * sp;
      if (spawn <= 0) {
        spawn = 1.1 + rand() * 0.7;
        ts.push({ d: 10, lane: (rand() < 0.5 ? -1 : 1) * (0.35 + rand() * 0.5), x: 0, y: 0, r: 0 });
      }
      for (let i = ts.length; i--;) {
        const tg = ts[i];
        tg.d -= sp * dt * 3.2; place(tg);
        if (tg.d < 0.9) {
          ts.splice(i, 1); away++; streak = 0;
          pop(Math.max(70, Math.min(W - 70, tg.x)), H * 0.8, 'Got away', C.white);
          if (away >= 5) { finish(score, 'points before 5 got away'); break; }
        }
      }
    },
    draw() {
      // Bands of mown grass sweeping toward you give the sense of speed.
      ctx.fillStyle = 'rgba(247,245,238,.09)';
      const f = dist % 1;
      for (let k = 0; k < 13; k++) {
        const d = k + 1 - f;
        if (d < 0.25) continue;
        const y1 = HZ + drop() / (d + 0.5), y2 = HZ + drop() / d;
        ctx.fillRect(0, y1, W, Math.min(H, y2) - y1);
      }
      ts.slice().sort((a, b) => b.d - a.d).forEach(tg => drawTarget(tg));
    },
    land(x, y) {
      if (this.ended) return true;
      for (const tg of ts.slice().sort((a, b) => a.d - b.d)) {
        const s = ringScore(tg, x, y);
        if (!s.v) continue;
        const pts = s.v * bonus(++streak);
        score += pts;
        pop(tg.x, tg.y - tg.r * 0.5, '+' + pts, pts >= 9 ? C.gold : C.white);
        for (let j = 0; j < 12; j++) { const a = rand() * TAU, v = U * (0.2 + rand() * 0.35); parts.push({ x: tg.x, y: tg.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, c: RINGS[(j * 3) % 10] }); }
        ts.splice(ts.indexOf(tg), 1);

      }
      streak = 0;   // the arrow hit nothing
      return 'gone';
    },
    stat() { return [['Speed', Math.round(sp * 30) + ' km/h'], ['Away', away + '/5'], ['Streak', streakText(streak)], ['Score', score]]; }
  };
}

function Bullseyes(secs) {
  const tg = { fx: 0.5, k: 1, x: 0, y: 0, r: 0 };
  let time = secs, hits = 0, moving = false;
  return {
    homing: () => [tg],
    intensity: () => 1 - time / secs,
    name: 'Bullseyes', key: 'bullseye' + secs, coin: s => s * 4, again: () => Bullseyes(secs), parent: bullMenu, backTo: 'Bullseyes',
    sub: secs + ' seconds. Only the center counts.',
    layout() {
      tg.r = Math.min(W * 0.2, H * 0.2) * tg.k * 1.4;
      tg.x = Math.max(tg.r + 8, Math.min(W - tg.r - 8, tg.fx * W)); tg.y = HZ - tg.r * 0.7;
    },
    ready() { return !this.ended; },
    update(dt) {
      if (this.ended) return;

    },
    draw() { drawTarget(tg); },
    land(x, y) {
      const s = ringScore(tg, x, y);

      hits++; moving = true;
      pop(tg.x, tg.y - tg.r, 'Bullseye!', C.gold);
      // The target moves and changes size after every bullseye.

      return true;
    },
    stat() { return [['Time', Math.ceil(time) + ' s'], ['Bullseyes', hits]]; }
  };
}

function Balloons(secs) {
  // Same order as the rings on a target face: the nearer to gold, the smaller, faster and more valuable.
  const kinds = [
    { c: C.white, tc: C.ink, p: 1, k: 0.06, v: 0.17 }, { c: C.black, tc: C.white, p: 2, k: 0.054, v: 0.2 },
    { c: C.blue, tc: C.white, p: 3, k: 0.048, v: 0.24 }, { c: C.red, tc: C.white, p: 4, k: 0.042, v: 0.29 },
    { c: C.gold, tc: C.ink, p: 5, k: 0.035, v: 0.36 }];
  let time = secs, score = 0, spawn = 0.3, streak = 0;
  const bs = [];
  return {
    intensity: () => 1 - time / secs,
    homing: () => bs, hitSound: 'pop', name: 'Balloons', key: secs === 30 ? 'balloons' : 'balloons60', coin: s => Math.round(s * 0.6), again: () => Balloons(secs), parent: balloonMenu, backTo: 'Balloons',
    sub: 'White 1, black 2, blue 3, red 4, gold 5.',
    layout() {},
    ready() { return !this.ended; },
    update(dt) {
      if (this.ended) return;
      time -= dt; spawn -= dt;
      if (spawn <= 0) {
        spawn = 1 + rand() * 0.8;
        const kind = kinds[Math.floor(rand() * 5)];
        bs.push({ ...kind, fx: 0.12 + rand() * 0.76, y: H + U * 0.1, v: kind.v * (0.9 + rand() * 0.25), ph: rand() * 6 });
      }
      for (let i = bs.length; i--;) {
        const b = bs[i];
        b.y -= b.v * H * dt; b.r = b.k * U; b.x = b.fx * W + Math.sin(t * 1.5 + b.ph) * U * 0.02;
        if (b.y < -b.r * 3) bs.splice(i, 1);

    },
    draw() { bs.forEach(drawBalloon); },
    land(x, y) {
      if (this.ended) return false;
      const i = bs.findIndex(b => Math.hypot(x - b.x, y - b.y) < b.r * 1.15);
      if (i < 0) { streak = 0; return false; }
      const b = bs.splice(i, 1)[0];
      const pts = b.p * bonus(++streak);
      score += pts;
      pop(b.x, b.y, '+' + pts, b.c);
      for (let j = 0; j < 10; j++) { const a = rand() * TAU, v = U * (0.2 + rand() * 0.3); parts.push({ x: b.x, y: b.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, c: b.c }); }
      return true;
    },
    stat() { return [['Time', Math.ceil(time) + ' s'], ['Streak', streakText(streak)], ['Score', score]]; }
  };
}

function Apple() {
  const d = { fx: 0.5, x: 0, y: 0, r: 0 };   // straw dummy; x,y is the head
  let round = 0, misses = 0, lock = false;
  const appleR = () => Math.max(U * 0.012, U * 0.034 * Math.pow(0.88, round));
  return {
    homing: () => (lock ? [] : [{ x: d.x, y: d.y - d.r - appleR() * 0.9, r: appleR() }]),
    intensity: () => Math.min(1, round / 6 + misses * 0.15),
    name: 'Apple', key: 'apple', coin: s => s * 6, again: Apple, parent: appleMenu, backTo: 'Apples',
    sub: 'Hit the apple. Three misses and you are out.',
    enter() { wind = 0; },
    layout() { d.r = U * 0.05; d.x = d.fx * W; d.y = HZ - d.r * 4.7; },

      ctx.beginPath(); ctx.arc(d.x - r * 0.35, d.y - r * 0.1, r * 0.09, 0, TAU); ctx.arc(d.x + r * 0.35, d.y - r * 0.1, r * 0.09, 0, TAU); ctx.fill();

      ctx.beginPath(); ctx.moveTo(d.x, ay - ar * 0.8); ctx.lineTo(d.x + ar * 0.25, ay - ar * 1.45); ctx.stroke();

function Pendulum() {

// A row of apples on a rail: clear them all in as few arrows as you can.
function AppleRow() {
  const N = 12, apples = [];

  let tries = 0, left = N;

    homing: () => apples.filter(a => !a.hit),
    intensity: () => (N - left) / N,
    name: 'Apple row', key: 'applerow12', lower: true, coin: s => Math.max(3, 40 - s), again: AppleRow, parent: appleMenu, backTo: 'Apples',
    sub: N + ' apples in a row. Clear them in as few arrows as you can.',

}

function shaft(x1, y1, x2, y2, w) {   // tip at 1, fletching at 2

function drawStuck(s) {

function drawFlight(a) {
  const k = a.t / a.T, e = 1 - (1 - k) * (1 - k);
  const x = a.x0 + (a.x - a.x0) * e, y = a.y0 + (a.y - a.y0) * e - Math.sin(Math.PI * k) * U * 0.05;
  const len = U * 0.2 * (1 - k * 0.85), dx = a.x0 - a.x, dy = a.y0 - a.y, m = Math.hypot(dx, dy) || 1;
  shaft(x, y, x + dx / m * len, y + dy / m * len, Math.max(1.5, 5 * (1 - k * 0.7)));

}
function drawBow(a) {   // the equipped bow, held flat at the shooting line; it bends as you draw
  const b = gear('bow'), p = ptr.down ? a.p : 0, cx = W / 2, gy = H - U * 0.13;

  const curve = q => (1 - q) * (1 - q) * ty + 2 * q * (1 - q) * top + q * q * ty;   // height of the limb at q along it
  if (b.zap) {   // electricity crackling along the string
    ctx.strokeStyle = b.b; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx - hs, ty);
    for (let i = 1; i < 10; i++) { const q = i / 10; ctx.lineTo(cx - hs + 2 * hs * q + (rand() - 0.5) * U * 0.02, ty + (ny - ty) * (1 - Math.abs(2 * q - 1)) + (rand() - 0.5) * U * 0.025); }
    ctx.lineTo(cx + hs, ty); ctx.stroke();
  }
  if (b.ember && rand() < 0.35) { const q = rand(); parts.push({ x: cx + (2 * q - 1) * hs, y: curve(q), vx: (rand() - 0.5) * U * 0.04, vy: -U * (0.25 + rand() * 0.2), t: 0, c: rand() < 0.5 ? '#ff8a1f' : '#ffd23f' }); }
  if (b.glow) { ctx.shadowColor = b.glow === true ? b.a : b.glow; ctx.shadowBlur = 16; }

    ctx.strokeStyle = b.b; ctx.lineWidth = Math.max(3, U * 0.009);

  }

      ctx.beginPath(); ctx.moveTo(cx + k * hs, ty);

  ctx.shadowBlur = 0;
  if (b.spikes) {
    ctx.fillStyle = b.b;
    [-0.7, -0.45, 0.45, 0.7].forEach(k => {
      const q = (k + 1) / 2, x = cx + k * hs, y = (1 - q) * (1 - q) * ty + 2 * q * (1 - q) * top + q * q * ty, z = U * 0.02;

}
function drawAim() {

/* ---------- loop ---------- */
let statKey = '';
function frame(now) {

  if (W && scene) {
    for (let i = timers.length; i--;) { const tm = timers[i]; if ((tm.t -= dt) <= 0) { timers.splice(i, 1); tm.fn(); } }
    scene.update(dt);

      const a = arrows[i];

      if (a.home) { a.x = a.home.tg.x + a.home.ox * a.home.tg.r; a.y = a.home.tg.y + a.home.oy * a.home.tg.r; }   // follows moving targets   // stay locked on a menu target even if the window resizes mid-flight

    parts = parts.filter(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += U * 1.2 * dt; return (p.t += dt) < 0.5; });

    drawBackdrop();

    stuck.forEach(s => { if (s.ref) drawStuck(s); });

    parts.forEach(p => { ctx.globalAlpha = 1 - p.t / 0.5; ctx.fillStyle = p.c; ctx.fillRect(p.x - 3, p.y - 3, 6, 6); });

      ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeStyle = C.ink; ctx.strokeText(p.text, p.x, y);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, y);

    const st = scene.stat(), key = st.join('|');

go(mainMenu());

})();
